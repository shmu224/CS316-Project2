<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Nature Discovery - Image Gallery</title>
      <link rel="stylesheet" href="styles.css">
   </head>
   <body>
      <nav class="top-bar" aria-label="Main navigation">
         <a href="index.html">Home</a>
         <a href="images.html">Image Gallery</a>
         <a href="hidden.html">Hidden Words</a>
      </nav>

      <main class="page-content">
         <h1 class="page-heading">Nature Image Gallery</h1>
         <p>Five illustrated places that would be fun to explore.</p>

         <section class="image-grid" aria-label="Nature illustrations">
            <figure class="image-card">
               <img src="mountains.svg" alt="Sun rising over blue mountains">
               <figcaption>Mountain Sunrise</figcaption>
            </figure>
            <figure class="image-card">
               <img src="forest.svg" alt="Green pine trees in a forest">
               <figcaption>Quiet Forest</figcaption>
            </figure>
            <figure class="image-card">
               <img src="ocean.svg" alt="Ocean waves beneath a bright sky">
               <figcaption>Ocean Waves</figcaption>
            </figure>
            <figure class="image-card">
               <img src="desert.svg" alt="Desert dunes and a cactus at sunset">
               <figcaption>Desert Sunset</figcaption>
            </figure>
            <figure class="image-card">
               <img src="waterfall.svg" alt="Waterfall flowing between green hills">
               <figcaption>Hidden Waterfall</figcaption>
            </figure>
         </section>
      </main>
   </body>
</html>
